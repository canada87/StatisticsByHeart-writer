# StatisticsByHeart writer: PRODUCTION stack (deployed as a Portainer stack on the Docker VM).
#
# No `build:` here on purpose: the image is built by GitHub Actions on every `vX.Y.Z` tag and
# published to GHCR; Portainer just pulls it (see README.md). Paste this file as a stack and set
# the variables from docker/.env.example.
#
# Networks: sbh-internal has NO route to the outside and carries the DB; only sbh-api is also on
# sbh-public, which is what lets it publish its port. The DB never publishes a port on the host.
name: statisticsbyheart

services:
  sbh-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: Europe/Rome
      POSTGRES_DB: sbh
      POSTGRES_USER: sbh
      POSTGRES_PASSWORD: ${SBH_DB_PASSWORD:?Set SBH_DB_PASSWORD (e.g. openssl rand -hex 24)}
    # Small footprint for a single-user workload (~0.5M samples/year).
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=20
    volumes:
      # LOCAL VM disk. Never put the live database on SMB/NAS.
      - ${SBH_DATA_DIR:-/home/docker2404/StatisticsByHeart}/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbh -d sbh"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [sbh-internal]
    mem_limit: 384m

  sbh-api:
    image: ghcr.io/canada87/statisticsbyheart-writer:${SBH_IMAGE_TAG:-0.7.0}
    restart: unless-stopped
    depends_on:
      sbh-db:
        condition: service_healthy
    environment:
      TZ: Europe/Rome
      SBH_DB_HOST: sbh-db
      SBH_DB_NAME: sbh
      SBH_DB_USER: sbh
      SBH_DB_PASSWORD: ${SBH_DB_PASSWORD}
      SBH_LOCAL_TIMEZONE: Europe/Rome
      SBH_SOURCE_PRIORITY: ${SBH_SOURCE_PRIORITY:-}
      # Heart Points: personal values, set them in the private .env / Portainer variables only
      SBH_BIRTH_YEAR: ${SBH_BIRTH_YEAR:-}
      SBH_HR_MAX: ${SBH_HR_MAX:-}
      SBH_COOKIE_SECURE: "true" # the browser reaches us via https (Nginx Proxy Manager)
      SBH_RUN_MIGRATIONS: ${SBH_RUN_MIGRATIONS:-true}
      # Behind NPM the client address is in X-Forwarded-For (used for login rate limiting only).
      FORWARDED_ALLOW_IPS: "*"
    ports:
      # Verify the port is free first: docker ps --format '{{.Ports}}'
      - "${SBH_BIND_ADDR:-0.0.0.0}:${SBH_HTTP_PORT:-8742}:8000"
    networks: [sbh-internal, sbh-public]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m

networks:
  sbh-internal:
    internal: true
  sbh-public:
